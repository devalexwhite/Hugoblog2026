{{ if gt .TotalPages 1 }}<nav class="pagination" aria-label="Pagination">{{ if .HasPrev }}<a href="{{ .Prev.URL }}">← Newer entries</a>{{ else }}<span></span>{{ end }}<span>{{ .PageNumber }} / {{ .TotalPages }}</span>{{ if .HasNext }}<a href="{{ .Next.URL }}">Older entries →</a>{{ else }}<span></span>{{ end }}</nav>{{ end }}
