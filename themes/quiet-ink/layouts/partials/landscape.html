{{ $art := resources.Get "images/bike-sign-watercolor.png" }}
{{ $small := $art.Resize "480x webp q85" }}
{{ $large := $art.Resize "960x webp q85" }}
<div class="landscape home-image">
	<img src="{{ $large.RelPermalink }}"
		srcset="{{ $small.RelPermalink }} 480w, {{ $large.RelPermalink }} 960w"
		sizes="(max-width: 640px) 340px, (max-width: 900px) 45vw, 480px"
		width="960" height="640"
		alt="Watercolor of a road bicycle beside Chinese directional signs on a riverbank."
		fetchpriority="high" decoding="async">
</div>
